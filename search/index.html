---
layout: default
title: جستجو
description: "جستجو در وبلاگ"
permalink: /search/
noindex: true
breadcrumb: true
---
<div class="container py-4">
  {% include breadcrumb.html %}

  <h1 class="mb-4"><i class="bi bi-search"></i> جستجو</h1>

  <div class="row mb-4">
    <div class="col-lg-8">
      <label for="search-input" class="form-label">کلمه کلیدی</label>
      <input type="search" id="search-input" class="form-control form-control-lg"
             placeholder="جستجو در مطالب..." autofocus>
    </div>
  </div>

  <div id="search-results" class="row g-3" aria-live="polite"></div>
</div>

<script>
(function () {
  'use strict';

  var jalaliMonths = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  var persianDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];

  function faNum(n) {
    return String(n).split('').map(function (c) {
      var d = parseInt(c, 10);
      return isNaN(d) ? c : persianDigits[d];
    }).join('');
  }

  function toJalali(gy, gm, gd) {
    var g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
    var gy2 = gy - 1600;
    var gm2 = gm - 1;
    var gd2 = gd - 1;

    var g_day_no = 365 * gy2
      + Math.floor((gy2 + 3) / 4)
      - Math.floor((gy2 + 99) / 100)
      + Math.floor((gy2 + 399) / 400)
      + gd2 + g_d_m[gm2];

    var isLeap = (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0;
    if (gm2 > 1 && isLeap) g_day_no++;

    var j_day_no = g_day_no - 79;
    var j_np = Math.floor(j_day_no / 12053);
    j_day_no = j_day_no % 12053;

    var jy = 979 + 33 * j_np + 4 * Math.floor(j_day_no / 1461);
    j_day_no = j_day_no % 1461;

    if (j_day_no >= 366) {
      jy += Math.floor((j_day_no - 1) / 365);
      j_day_no = (j_day_no - 1) % 365;
    }

    var jm, jd;
    if (j_day_no < 186) {
      jm = 1 + Math.floor(j_day_no / 31);
      jd = 1 + (j_day_no % 31);
    } else {
      jm = 7 + Math.floor((j_day_no - 186) / 30);
      jd = 1 + ((j_day_no - 186) % 30);
    }

    return { jy: jy, jm: jm, jd: jd };
  }

  function toFaDate(isoString) {
    if (!isoString) return '';
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(isoString);
    if (!m) return isoString;
    var gy = parseInt(m[1], 10);
    var gm = parseInt(m[2], 10);
    var gd = parseInt(m[3], 10);
    var j = toJalali(gy, gm, gd);
    return faNum(j.jd) + ' ' + (jalaliMonths[j.jm - 1] || '') + ' ' + faNum(j.jy);
  }

  document.addEventListener('DOMContentLoaded', async function () {
    var input = document.getElementById('search-input');
    var results = document.getElementById('search-results');
    var posts = [];

    try {
      var res = await fetch('{{ "/posts.json" | relative_url }}');
      posts = await res.json();
    } catch (e) {
      results.innerHTML = '<div class="alert alert-danger">خطا در بارگذاری داده‌ها.</div>';
      return;
    }

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    function render(query) {
      var q = (query || '').trim().toLowerCase();
      if (q.length < 2) {
        results.innerHTML = '<p class="text-muted">حداقل ۲ کاراکتر وارد کنید.</p>';
        return;
      }
      var matches = posts.filter(function (p) {
        return (p.title && p.title.toLowerCase().indexOf(q) > -1) ||
               (p.excerpt && p.excerpt.toLowerCase().indexOf(q) > -1) ||
               (p.tags && p.tags.some(function (t) { return t.toLowerCase().indexOf(q) > -1; }));
      });
      if (!matches.length) {
        results.innerHTML = '<p class="text-muted">نتیجه‌ای یافت نشد.</p>';
        return;
      }
      results.innerHTML = matches.map(function (p) {
        return '<div class="col-md-6 col-lg-4">' +
          '<article class="card h-100 shadow-sm">' +
          '<div class="card-body">' +
          '<h3 class="h6"><a href="' + esc(p.url) + '" class="text-decoration-none">' + esc(p.title) + '</a></h3>' +
          '<p class="small text-muted mb-0">' + esc(p.excerpt) + '</p>' +
          '</div>' +
          '<div class="card-footer bg-white border-0 small text-muted">' +
            '<time datetime="' + esc(p.date) + '">' + esc(toFaDate(p.date)) + '</time>' +
          '</div>' +
          '</article></div>';
      }).join('');
    }

    var params = new URLSearchParams(window.location.search);
    var initial = params.get('q');
    if (initial) { input.value = initial; render(initial); }
    else { results.innerHTML = '<p class="text-muted">عبارت مورد نظر را وارد کنید.</p>'; }

    var timer;
    input.addEventListener('input', function (e) {
      clearTimeout(timer);
      var v = e.target.value;
      timer = setTimeout(function () { render(v); }, 200);
    });
  });
})();
</script>
