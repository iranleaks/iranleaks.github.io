# ============================================
# تنظیمات اصلی سایت
# ============================================
title: "ایران لیکس"
description: "وبلاگ ایران لیکس — تحلیل، بررسی و اخبار فناوری، امنیت و حریم خصوصی"
url: "https://iranleaks.github.io"
baseurl: ""
lang: fa
dir: rtl

# نویسنده
author:
  name: "Iran Leaks"
  email: "info@iranleaks.github.io"

# لوگو و فاویکون
logo: "/blog.svg"
favicon: "/blog.svg"

# ============================================
# شبکه‌های اجتماعی
# هر فیلد را با آدرس واقعی جایگزین کن.
# اگر خالی بماند (""), دکمه‌اش در فوتر نمایش داده نمی‌شود.
# ============================================
social:
  name: "Iran Leaks"
  instagram: "https://instagram.com/ehsanchehri"
  x: ""
  facebook: "https://facebook.com/ehsanchehri"
  youtube: ""
  linkedin: "https://linkedin.com/in/ehsanchehri"

# ============================================
# تنظیمات ساخت
# ============================================
markdown: kramdown
highlighter: rouge

# آدرس پست‌ها: /tag/title/
# مهم: در هر پست حتماً categories را برابر تگ اصلی بگذارید
#   categories: [امنیت]
permalink: /:categories/:title/

timezone: Asia/Tehran

kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  toc_levels: 1..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# ============================================
# افزونه‌ها
# ============================================
# jekyll-sitemap حذف شد — سایت‌مپ سفارشی در /sitemap.xml
plugins: []

# ============================================
# پیش‌فرض‌ها
# ============================================
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# ============================================
# موارد مستثنی
# ============================================
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - .bundle
