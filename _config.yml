title: "بلاندر"
description: "بلاندر؛ نقد و بررسی اتفاقات تاریخی"
url: "https://iranleaks.github.io"
baseurl: ""
lang: fa
dir: rtl

author:
  name: "احسان چهری"
  email: "ehsanchehri@gmail.com"

logo: "/blog.svg"
favicon: "/blog.svg"

social:
  name: "احسان چهری"
  instagram: "https://instagram.com/ehsanchehri"
  x: ""
  facebook: "https://facebook.com/ehsanchehri"
  youtube: ""
  linkedin: "https://linkedin.com/in/ehsanchehri"

markdown: kramdown
highlighter: rouge

permalink: /:categories/:title/

timezone: Asia/Tehran

kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  toc_levels: 1..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - .bundle
