title: "ایران لیکس"
description: "وبلاگ ایران لیکس — تحلیل، بررسی و اخبار فناوری، امنیت و حریم خصوصی"
url: "https://iranleaks.github.io"
baseurl: ""
lang: fa
dir: rtl

author:
  name: "Iran Leaks"
  email: "info@iranleaks.github.io"

logo: "/blog.svg"
favicon: "/blog.svg"

social:
  name: "Iran Leaks"
  instagram: "https://instagram.com/iranleaks"
  x: "https://x.com/iranleaks"
  facebook: "https://facebook.com/iranleaks"
  youtube: "https://youtube.com/@iranleaks"
  linkedin: "https://linkedin.com/company/iranleaks"

markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: Asia/Tehran

kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  toc_levels: 1..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins: []

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - .bundle
