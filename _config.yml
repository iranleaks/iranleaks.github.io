# ============================================
# تنظیمات اصلی سایت
# ============================================
title: "ایران لیکس"
description: "وبلاگ ایران لیکس — تحلیل، بررسی و اخبار فناوری، امنیت و حریم خصوصی"
url: "https://iranleaks.github.io"
baseurl: ""
lang: fa
dir: rtl

# نویسنده
author:
  name: "Iran Leaks"
  email: "info@iranleaks.github.io"

# لوگو و فاویکون
logo: "/blog.svg"
favicon: "/blog.svg"

# شبکه‌های اجتماعی
social:
  name: "Iran Leaks"
  links:
    - "https://iranleaks.github.io"

# ============================================
# تنظیمات ساخت
# ============================================
markdown: kramdown
highlighter: rouge

# آدرس پست‌ها: /tag/title/
# مهم: در هر پست حتماً categories را برابر تگ اصلی بگذارید
#   categories: [امنیت]
permalink: /:categories/:title/

timezone: Asia/Tehran

kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  toc_levels: 1..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# ============================================
# افزونه‌ها (سازگار با GitHub Pages)
# ============================================
plugins:
  - jekyll-feed
  - jekyll-sitemap

# فید RSS در /rss.xml
feed:
  path: rss.xml
  posts_limit: 20

# ============================================
# پیش‌فرض‌ها
# ============================================
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# ============================================
# موارد مستثنی
# ============================================
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - .bundle
