title: "ایران لیکس"
description: "وبلاگ ایران لیکس — تحلیل، بررسی و اخبار فناوری، امنیت و حریم خصوصی"
url: "https://iranleaks.github.io"
baseurl: ""
lang: fa
dir: rtl

author:
  name: "احسان چهری"
  email: "ehsanchehri@gmail.com"

logo: "/blog.svg"
favicon: "/blog.svg"

social:
  name: "Iran Leaks"
  links:
    - "https://iranleaks.github.io"

markdown: kramdown
highlighter: rouge

permalink: /:categories/:title/

timezone: Asia/Tehran

kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  toc_levels: 1..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - .bundle
