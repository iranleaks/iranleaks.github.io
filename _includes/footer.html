<footer class="site-footer bg-dark text-light mt-5 py-4">
  <div class="container">
    <div class="row g-4">
      <div class="col-md-4">
        <h5 class="fw-bold d-flex align-items-center">
          <img src="{{ site.logo | relative_url }}" alt="" width="48" height="48" class="me-2">
          {{ site.title }}
        </h5>
        <p class="text-secondary small mb-0">{{ site.description }}</p>
      </div>

      <div class="col-md-4">
        <h6 class="fw-bold">دسترسی سریع</h6>
        <ul class="list-unstyled small">
          <li class="mb-1"><a href="{{ '/' | relative_url }}" class="link-light text-decoration-none"><i class="bi bi-chevron-left"></i> خانه</a></li>
          <li class="mb-1"><a href="{{ '/blog/' | relative_url }}" class="link-light text-decoration-none"><i class="bi bi-chevron-left"></i> وبلاگ</a></li>
          <li class="mb-1"><a href="{{ '/about/' | relative_url }}" class="link-light text-decoration-none"><i class="bi bi-chevron-left"></i> درباره ما</a></li>
          <li class="mb-1"><a href="{{ '/rss/' | relative_url }}" class="link-light text-decoration-none"><i class="bi bi-rss"></i> خوراک RSS</a></li>
          <li class="mb-1"><a href="{{ '/sitemap.xml' | relative_url }}" class="link-light text-decoration-none"><i class="bi bi-diagram-3"></i> نقشه سایت</a></li>
        </ul>
      </div>

      <div class="col-md-4">
        <h6 class="fw-bold">تماس</h6>
        <p class="small text-secondary mb-1">
          <i class="bi bi-envelope"></i> {{ site.author.email }}
        </p>
        <p class="small text-secondary">
          <i class="bi bi-globe"></i> {{ site.url }}
        </p>
      </div>
    </div>

    <hr class="border-secondary">
    <div class="text-center small text-secondary">
      &copy; {{ site.time | date: '%Y' }} {{ site.title }} — تمامی حقوق محفوظ است.
    </div>
  </div>
</footer>
