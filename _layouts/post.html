---
layout: default
---

<article class="post">
  <header class="post-header">
    <p class="post-meta">
      {{ page.date | date: "%Y/%m/%d" }}
    </p>

    <h1>{{ page.title }}</h1>

    {% if page.description %}
      <p class="post-description">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% if page.tags %}
    <div class="post-tags">
      {% for tag in page.tags %}
        <span>#{{ tag }}</span>
      {% endfor %}
    </div>
  {% endif %}
</article>
